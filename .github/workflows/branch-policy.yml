name: Branch Policy

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate-source-branch:
    name: Validate source branch
    runs-on: ubuntu-latest

    steps:
      - name: Allow only release branches into master
        shell: bash
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Pull request: $SOURCE_BRANCH -> $TARGET_BRANCH"

          if [[ "$SOURCE_BRANCH" != release/* ]]; then
            echo "::error::Only release/* branches can be merged into master."
            exit 1
          fi

          echo "Branch policy passed."
