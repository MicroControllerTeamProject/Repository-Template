name: Validate Source Branch

on:
  pull_request:
    branches:
      - main

jobs:
  validate-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only release to main
        shell: bash
        run: |
          if [ "${{ github.head_ref }}" != "release" ]; then
            echo "Pull requests to main are allowed only from the release branch."
            echo "Current source branch: ${{ github.head_ref }}"
            exit 1
          fi

          echo "Valid source branch: release"
